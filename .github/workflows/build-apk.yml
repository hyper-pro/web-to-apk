name: Build APK Free

on:
  repository_dispatch:
    types: [build-apk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install Cordova and dependencies
        run: |
          npm install -g cordova
          sudo apt-get install -y default-jdk

      - name: Create Web App
        run: |
          cordova create myapp com.webview.app "${{ github.event.client_payload.appName }}"
          cd myapp
          cordova platform add android
          
          # ඇප් අයිකන් එක සේව් කිරීම
          wget "${{ github.event.client_payload.iconUrl }}" -O www/icon.png
          
          # Web Url එකට redirect වීම සඳහා HTML එක වෙනස් කිරීම
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=${{ github.event.client_payload.appUrl }}" /></head><body>Loading Application...</body></html>' > www/index.html
          
          # APK එක Compile කිරීම
          cordova build android
          
      - name: Upload Generated APK
        uses: actions/upload-artifact@v3
        with:
          name: Created_Android_App
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
